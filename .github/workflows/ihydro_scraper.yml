name: iHYDRO Live Telemetry Sync

on:
  schedule:
    - cron: "*/30 * * * *" # Runs automatically every 30 minutes
  workflow_dispatch:       # Enables the manual "Run workflow" button in GitHub
    inputs:
      sync_stations_first:
        description: "Also refresh master station list & GPS coordinates? (true/false)"
        required: false
        default: "false"

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Optional — Sync Master Stations & Coordinates
        if: ${{ github.event.inputs.sync_stations_first == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python src/ihydro/sync_stations.py
          python src/ihydro/sync_coordinates.py

      - name: Run Live Telemetry Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/ihydro/live_telemetry_worker.py --once